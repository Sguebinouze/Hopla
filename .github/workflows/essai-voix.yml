name: Essai des voix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/voix/essai.mjs
        env:
          GOOGLE_TTS_CLE: ${{ secrets.GOOGLE_TTS_CLE }}
      # Les fichiers vont sur une branche à part (essai-voix), jamais sur main.
      - run: |
          cd essai-voix
          git init -q -b essai-voix
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Essai des voix"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" essai-voix
