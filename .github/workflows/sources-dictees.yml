name: Sources des dictées

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/dictees/sources.py sources-dictees
      # Les fichiers vont sur une branche à part (sources-dictees), jamais sur main.
      - run: |
          cd sources-dictees
          git init -q -b sources-dictees
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Sources des dictées"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sources-dictees
